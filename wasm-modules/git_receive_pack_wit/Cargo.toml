[package]
name = "git_receive_pack_wit"
description = "WIT-typed (component-model) git receive-pack handler. Demonstrates the new ABI introduced by ADR-0062 + RFC-0003 Slice 5. Coexists with git_receive_pack (legacy JSON-blob ABI) until the kernel-side component dispatcher lands."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
wit-bindgen = "0.36"

tg-canonical = { path = "../../canonical" }
tg-wire = { path = "../../wire" }

serde = { workspace = true }
serde_json = { workspace = true }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
